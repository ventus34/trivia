name: Trivia Desktop

on:
  push:
    branches: [codex/trivia-desktop]
  pull_request:
    paths:
      - '.github/workflows/trivia-desktop.yml'
      - 'databases/**'
      - 'icons/**'
      - 'index.html'
      - 'js/**'
      - 'scripts/build-desktop.mjs'
      - 'scripts/tailwind.desktop.cjs'
      - 'src-tauri/**'
      - 'tests/**'
      - '*.css'
      - 'package*.json'
      - 'sw.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS universal
            runner: macos-15
            file: Trivia-macos-universal.zip
          - platform: Windows x64
            runner: windows-2025
            file: Trivia-windows-x64.zip
          - platform: Linux x64
            runner: ubuntu-24.04
            file: Trivia-linux-x64.AppImage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Prepare Rust
        run: rustup update stable --no-self-update
      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add --toolchain stable aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - name: Build the portable macOS app
        if: runner.os == 'macOS'
        run: |
          npm run tauri -- build --ci --target universal-apple-darwin -- --locked
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Trivia.app
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/trivia"
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" Trivia-macos-universal.zip
      - name: Build the portable Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run tauri -- build --ci --no-bundle -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path src-tauri/target/release/trivia.exe -DestinationPath Trivia-windows-x64.zip
      - name: Build the portable Linux app
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          npm run tauri -- build --ci -- --locked
          cp src-tauri/target/release/bundle/appimage/*.AppImage Trivia-linux-x64.AppImage
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.file }}
          archive: false
          if-no-files-found: error
